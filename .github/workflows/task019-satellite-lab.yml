name: KASPYRA Task 019 Network Calibration
on:
  workflow_dispatch:
  push:
    paths:
      - 'task019/**'
      - '.github/workflows/task019-satellite-lab.yml'
permissions:
  contents: read
jobs:
  netem-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install network utilities
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Calibrate in isolated network namespaces
        run: sudo python3 task019/calibrate.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task019-calibration-evidence
          path: task019-calibration.json
          if-no-files-found: error
