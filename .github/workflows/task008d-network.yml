name: KASPYRA Task 008D Four Validator Integration
on:
  push:
    paths:
      - 'task008c/**'
      - 'task008d/**'
      - '.github/workflows/task008d-network.yml'
  pull_request:
    paths:
      - 'task008c/**'
      - 'task008d/**'
      - '.github/workflows/task008d-network.yml'
  workflow_dispatch:
jobs:
  four-validators:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CometBFT v0.38.17
        run: |
          go install github.com/cometbft/cometbft/cmd/cometbft@v0.38.17
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Python signing dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Run four validator integration
        run: python task008d/run_four_validators.py
