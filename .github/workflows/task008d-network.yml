
name: KASPYRA Task 008D Four Validator Integration

on:
  push:
    paths:
      - "task008c/**"
      - "task008d/**"
      - ".github/workflows/task008d-network.yml"
  pull_request:
    paths:
      - "task008c/**"
      - "task008d/**"
      - ".github/workflows/task008d-network.yml"
  workflow_dispatch:

jobs:
  four-validators:
    name: Four Validator Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=44,<47"

      - name: Install CometBFT
        run: |
          git clone --depth 1 --branch v0.38.17 \
            https://github.com/cometbft/cometbft.git \
            /tmp/cometbft

          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft

          cometbft version

      - name: Resolve KASPYRA Go dependencies
        working-directory: task008c
        run: |
          go mod tidy
          go mod verify

      - name: Build KASPYRA ABCI application
        working-directory: task008c
        run: |
          go build -o /tmp/kaspyra-abci .

      - name: Run four-validator integration
        run: |
          python task008d/run_four_validators.py
