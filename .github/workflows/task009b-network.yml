name: KASPYRA Task 009B Partition and ABCI Recovery

on:
  push:
    paths:
      - 'task008c/**'
      - 'task009b/**'
      - '.github/workflows/task009b-network.yml'
  pull_request:
    paths:
      - 'task008c/**'
      - 'task009b/**'
      - '.github/workflows/task009b-network.yml'
  workflow_dispatch:

jobs:
  partition-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CometBFT v0.38.17
        run: |
          git clone --depth 1 --branch v0.38.17 https://github.com/cometbft/cometbft.git /tmp/cometbft
          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft
          cometbft version
      - name: Resolve Go dependencies (matching Task 008D baseline)
        working-directory: task008c
        run: |
          go mod tidy
          go mod verify
      - name: Run real P2P partition and ABCI restart experiments
        run: python task009b/run_partition_recovery.py
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task009b-evidence
          path: task009b-result.json
          if-no-files-found: warn
