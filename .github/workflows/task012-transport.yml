name: KASPYRA Task 012 Transport Prototype
on:
  push:
    paths:
      - 'task012/**'
      - 'TASK_012_README.md'
      - '.github/workflows/task012-transport.yml'
  pull_request:
    paths:
      - 'task012/**'
      - 'TASK_012_README.md'
      - '.github/workflows/task012-transport.yml'
  workflow_dispatch:
jobs:
  transport-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=44,<47'
      - run: python -m unittest discover -s task012 -p 'test_*.py' -v
