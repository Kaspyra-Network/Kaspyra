name: KASPYRA Task 019 Four Validator NetEm
on:
  workflow_dispatch:
  push:
    paths:
      - 'task019/validator_netem.py'
      - '.github/workflows/task019-validator-netem.yml'
jobs:
  validator-netem:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Install CometBFT v0.38.17
        run: |
          git clone --depth 1 --branch v0.38.17 https://github.com/cometbft/cometbft.git /tmp/cometbft
          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft
          cometbft version
      - name: Verify Go dependencies
        working-directory: task008c
        run: go mod verify
      - name: Run four real validators with isolated NetEm links
        run: sudo --preserve-env=PATH python task019/validator_netem.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task019-validator-netem-evidence
          path: task019-validator-evidence.json
          if-no-files-found: error
