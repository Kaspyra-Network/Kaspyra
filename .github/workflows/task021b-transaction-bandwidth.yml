name: KASPYRA Task 021B Transaction Bandwidth
on:
  workflow_dispatch:
  push:
    paths:
      - 'task021/transaction_bandwidth.py'
      - 'task021/txgen.go'
      - 'task021/txgen_test.go'
      - '.github/workflows/task021b-transaction-bandwidth.yml'
permissions:
  contents: read
jobs:
  transaction-bandwidth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Install CometBFT v0.38.17
        run: |
          git clone --depth 1 --branch v0.38.17 https://github.com/cometbft/cometbft.git /tmp/cometbft
          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft
          cometbft version
      - name: Verify deterministic transaction fixture format
        run: go test task021/txgen.go task021/txgen_test.go
      - name: Resolve KASPYRA Go dependencies
        working-directory: task008c
        run: |
          go mod tidy
          go mod verify
      - name: Run isolated transaction bandwidth benchmark
        run: sudo --preserve-env=PATH python task021/transaction_bandwidth.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task021b-transaction-bandwidth-evidence
          path: task021b-bandwidth-evidence.json
          if-no-files-found: warn
