name: KASPYRA Task 020 Intermittent Connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'task020/**'
      - '.github/workflows/task020-intermittent.yml'
jobs:
  intermittent-connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Install CometBFT v0.38.17
        run: |
          git clone --depth 1 --branch v0.38.17 https://github.com/cometbft/cometbft.git /tmp/cometbft
          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft
          cometbft version
      - name: Resolve KASPYRA Go dependencies
        working-directory: task008c
        run: |
          go mod tidy
          go mod verify
      - name: Run four validators with intermittent blackouts
        run: sudo --preserve-env=PATH python task020/intermittent.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task020-intermittent-evidence
          path: task020-validator-evidence.json
          if-no-files-found: error
