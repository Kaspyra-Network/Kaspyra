name: KASPYRA Task 009A Validator Failure Tests

on:
  push:
    paths:
      - 'task008c/**'
      - 'task009/**'
      - '.github/workflows/task009-network.yml'
  pull_request:
    paths:
      - 'task008c/**'
      - 'task009/**'
      - '.github/workflows/task009-network.yml'
  workflow_dispatch:

jobs:
  validator-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CometBFT v0.38.17
        run: |
          git clone --depth 1 --branch v0.38.17 https://github.com/cometbft/cometbft.git /tmp/cometbft
          cd /tmp/cometbft
          go build -o /usr/local/bin/cometbft ./cmd/cometbft
          cometbft version
      - name: Resolve Go dependencies (matching Task 008D baseline)
        working-directory: task008c
        run: |
          go mod tidy
          go mod verify
      - name: Run real process-failure experiments
        run: python task009/run_faults.py
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task009a-evidence
          path: task009-result.json
          if-no-files-found: warn
